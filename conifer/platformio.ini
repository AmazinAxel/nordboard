; Snowlayer keyboard firmware — CH32X035G8U6
; Community CH32V platform + WCH openwch Arduino core.
; Docs: https://github.com/Community-PIO-CH32V/platform-ch32v

[env:snowlayer]
platform     = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board        = genericCH32X035G8U6
framework    = arduino

; --- Flashing --------------------------------------------------------------
; Default: WCH-LinkE programmer over the single-wire debug pin (PD1/SWDIO).
upload_protocol = wch-link
;
; No programmer? The CH32X035 has a factory USB bootloader. Comment the line
; above and uncomment the one below, then flash over the board's USB-C port
; (see README / the flashing notes for how to enter the bootloader).
; upload_protocol = isp

build_flags =
    -Os
